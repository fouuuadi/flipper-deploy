name: Build ESP32 firmware

# Le code source du firmware vit dans le repo Flipper_firmware (source unique).
# Ce workflow le clone, compile le profil `prod`, fusionne le binaire et le
# committe dans firmware/build/firmware.bin — que Fliphetic flashe au Load
# (la borne clone ce repo et lit le .bin dans l'arbre git ; cf. fliphetic.toml).
#
# Déclenché par Flipper_firmware à chaque push (repository_dispatch), ou à la main.

on:
  repository_dispatch:
    types: [firmware-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      # checkout de CE repo : c'est ici qu'on committe le binaire.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # La source unique du firmware : on la clone au build (pas de copie ici).
      - name: Clone firmware sources
        run: git clone --depth 1 https://github.com/fouuuadi/Flipper_firmware.git firmware-src

      - name: Build (prod profile)
        # Le mot de passe WiFi vient du secret GitHub WIFI_PASS — jamais dans les
        # sources (repos publics). Il finit gravé dans le binaire committé : garde
        # une passphrase AP dédiée, pas un mot de passe réutilisé.
        env:
          PLATFORMIO_BUILD_FLAGS: -DWIFI_PASSWORD='"${{ secrets.WIFI_PASS }}"'
        run: pio run -e prod --project-dir firmware-src

      - name: Merge into a single flashable image
        run: |
          BUILD=firmware-src/.pio/build/prod
          mkdir -p firmware/build
          esptool --chip esp32 merge_bin -o firmware/build/firmware.bin \
            0x1000  "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

      - name: Commit the binary
        run: |
          git config user.name  "firmware-ci"
          git config user.email "firmware-ci@users.noreply.github.com"
          git add firmware/build/firmware.bin
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "ci: rebuild ESP32 firmware from Flipper_firmware [skip ci]"
          git push
