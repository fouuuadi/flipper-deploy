[app]
id          = "flipper-cabinet"
name        = "Flipper Virtuel — HETIC"
authors     = ["Fouad"]
description = "Flipper virtuel 3D temps réel : 3 écrans (playfield, backglass, DMD) servis par nginx, backend FastAPI + Redis + Postgres + broker MQTT. Tout est tiré d'images publiées sur GHCR."

[deploy]
strategy = "branch"
ref      = "main"

# Chaque écran pointe vers son service front (port DU CONTENEUR = 8080).
[screens]
playfield = { service = "playfield", port = 8080 }
backglass = { service = "backglass", port = 8080 }
dmd       = { service = "dmd", port = 8080 }

[compose]
file          = "deploy/docker-compose.yml"
# Généreux : la borne pull plusieurs images + Postgres applique les scripts
# d'init avant que le backend ne devienne healthy.
ready_timeout = 90

# Firmware des boutons physiques : la borne flashe ce binaire sur le device
# « esp32 » à chaque Load. Sources dans le repo Flipper_firmware ; le .bin est
# buildé depuis ce repo + committé ici par la CI (.github/workflows/firmware.yml,
# déclenchée à chaque push firmware). baud 115200 (le défaut 921600 fait planter
# certains flashs). required = false → un Load continue si l'ESP32 est absent.
[esp32.esp32]
firmware   = "firmware/build/firmware.bin"
chip       = "esp32"
flash_addr = "0x0"
baud       = 115200
required   = false
