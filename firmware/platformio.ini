; Firmware ESP32 des boutons physiques de la borne.
; La CI (.github/workflows/firmware.yml) lance `pio run` ici, fusionne la sortie
; avec esptool, et committe firmware/build/firmware.bin — que Fliphetic flashe
; au Load (cf. le bloc [esp32.esp32] de fliphetic.toml). La borne ne compile pas.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    ; Valeurs NON secrètes, en dur (ce repo est public).
    -DWIFI_SSID='"FLIPHETIC_CAB0"'
    -DMQTT_BROKER_PORT=1883
    -DDEVICE_ID='"esp32-test"'
    ; Pas d'IP de broker en dur : le firmware joint la passerelle WiFi, càd la
    ; borne elle-même (elle héberge l'AP FLIPHETIC_CAB0), cf. connectMqtt(). Une
    ; IP Tailscale (100.64/10) ne marcherait jamais : l'ESP32 n'est pas sur le
    ; tailnet. Pour forcer une IP précise : ajouter -DMQTT_BROKER_HOST='"x.x.x.x"'.
    ; WIFI_PASSWORD : injecté par la CI via PLATFORMIO_BUILD_FLAGS depuis le
    ; secret GitHub WIFI_PASS (jamais dans les sources). Fallback vide en local
    ; (cf. include/Config.h) → le build passe, mais le WiFi ne connecte pas.
