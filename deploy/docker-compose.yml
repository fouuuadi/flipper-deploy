# Stack complète du flipper virtuel, lancée par la borne Fliphetic.
# Tout est tiré d'images publiées (aucun build sur la borne) :
#   - 3 fronts nginx (un par écran)  → ghcr.io/fouuuadi/flipper-front-<screen>
#   - backend FastAPI                → ghcr.io/fouuuadi/flipper-backend
#   - db / redis / mqtt              → images publiques
#
# Les 3 fronts proxifient /api et /ws vers le service `backend` (même origine),
# donc seuls eux exposent un port (éphémère). Les secrets (mot de passe DB)
# sont injectés par le dashboard de la borne via variables d'environnement.
name: flipper

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Non-secrets : valeurs littérales. Pas d'interpolation : le dashboard
      # Fliphetic injecte dans les conteneurs, pas dans le process compose,
      # donc une interpolation au parse ne verrait jamais ses valeurs.
      POSTGRES_DB: flipper
      POSTGRES_USER: flipper_user
      # POSTGRES_PASSWORD : SEUL secret, injecté par le dashboard Fliphetic
      # directement dans le conteneur (ne PAS le déclarer ici). Si absent,
      # l'image postgres refuse de s'initialiser → fail-fast.
    volumes:
      - db_data:/var/lib/postgresql/data
      # Schéma initial (mirroir de Flipper_back/db/init — garder synchro).
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipper_user -d flipper"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 -i healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/fouuuadi/flipper-backend:${BACKEND_IMAGE_TAG:-latest}
    # Images publiées en linux/amd64 uniquement → forçage explicite (natif sur
    # la borne x86, émulé sur un Mac Apple Silicon en dev).
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      # Topologie interne (noms de services du réseau Docker) + constantes
      # applicatives : valeurs littérales, fixées par ce compose, pas de la
      # config de déploiement → ne se mettent pas dans le dashboard.
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_TTL_SECONDS: "1800"
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC_FILTER: "flipper/#"
      DB_NAME: flipper
      DB_USER: flipper_user
      LOG_LEVEL: INFO
      # DB_PASSWORD : SEUL secret, injecté par le dashboard Fliphetic directement
      # dans le conteneur (ne PAS le déclarer ici). Absent → l'app lève une
      # ValidationError au démarrage (fail-fast).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  playfield:
    image: ghcr.io/fouuuadi/flipper-front-playfield:${FRONT_IMAGE_TAG:-main-latest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  backglass:
    image: ghcr.io/fouuuadi/flipper-front-backglass:${FRONT_IMAGE_TAG:-main-latest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  dmd:
    image: ghcr.io/fouuuadi/flipper-front-dmd:${FRONT_IMAGE_TAG:-main-latest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
